{% load i18n %}
<div class="carousel-item white-text material-banner{% if first %} is-active{% endif %}"
  role="group" aria-roledescription="{% trans 'slide' %}"
  aria-label="{% blocktrans %}{{ slide_number }} of {{ total_slides }}{% endblocktrans %}">
  <img class="material-banner-image"
    src="{{ carousel_item.best_large_image_url }}"
    alt="{{ carousel_item.best_large_image_alt_text }}">
  {% if carousel_item.carousel_title %}
    {# Not pk: an article and a news item can share one. #}
    <div class="material-banner-heading" tabindex="0" role="region" aria-labelledby="carousel-title-{{ slide_number }}">
      <div class="carousel-text-wrapper">
        <a href="{{ carousel_item.url }}">
            <h2 id="carousel-title-{{ slide_number }}">{{ carousel_item.carousel_title|truncatechars_html:200|safe }}</h2>
          {% if carousel_item.carousel_subtitle %}
            <p>{{ carousel_item.carousel_subtitle|safe }}</p>
          {% endif %}
        </a>
      </div>
    </div>
  {% endif %}
</div>

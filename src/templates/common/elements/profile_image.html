{% load static %}
{% load alt_text %}
{% get_alt_text file_path=user.profile_image as profile_image_alt_text %}
<img
    class="{{ classes }}"
    src="{% if user.profile_image %}{{ user.profile_image.url }}{% elif request.journal.default_profile_image %}{{ request.journal.default_profile_image.url }}{% else %}{% static "common/img/icons/users.png" %}{% endif %}"
    alt="{% if user.profile_image %}{% if profile_image_alt_text %}{{ profile_image_alt_text }}{% else %}Profile picture for {{ user.full_name }}{% endif %}{% else %}A generic headshot photograph of a person{% endif %}"
/>

{% load static %}
<link href="{% static 'common/css/mathjax.css' %}" rel="stylesheet">
<script>
  window.MathJax = {
    loader: {load: ['input/asciimath']},
    {% if linebreaks %}
    output: {displayOverflow: 'linebreak', linebreaks: {inline: true, width: '100%'}},
    {% endif %}
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/4.1.3/tex-mml-chtml.min.js"></script>

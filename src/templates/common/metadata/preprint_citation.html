<meta name="citation_title" content="{{ version.display_title|striptags }}">{% for author in version.authors %}
<meta name="citation_author" content="{{ author.full_name }}"/>{% endfor %}
{% if preprint.date_published %}<meta name="citation_publication_date" content="{{ preprint.date_published|date:"Y-m-d" }}">{% endif %}
{% if version.file_type == 'pdf' %}<meta name="citation_pdf_url" content="{% site_url 'repository_file_download' preprint.id version.file.id %}">{% endif %}
<meta name="citation_abstract" lang="en" content="{{ version.display_abstract|safe }}">

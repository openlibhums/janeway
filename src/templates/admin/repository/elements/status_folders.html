<nav class="inbox-folders" aria-label="{{ label }}">
    <ul class="menu vertical">
        {% for tab in tabs %}
            <li{% if tab.active %} class="active"{% endif %}>
                <a href="?{{ tab.query }}"{% if tab.active %} aria-current="page"{% endif %}>
                    <span class="fa fa-fw {{ tab.icon }}" aria-hidden="true"></span>
                    <span class="inbox-folder-label">{{ tab.label }}</span>
                    <span class="badge">{{ tab.count }}</span>
                </a>
            </li>
        {% endfor %}
    </ul>
</nav>

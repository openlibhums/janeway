{% comment %}
Renders a select field as a filterable combobox.
Requires field and static/admin/js/filter-select.js on the page.
{% endcomment %}
<div class="filter-select" data-placeholder="{% trans 'Type to filter' %}" data-no-matches="{% trans 'No matches' %}">
    <label for="{{ field.id_for_label }}" class="show-for-sr">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}
        <small class="form-error is-visible">{{ error }}</small>
    {% endfor %}
</div>
